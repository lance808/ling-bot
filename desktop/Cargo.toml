[package]
name = "ling-bot-desktop"
version = "0.1.0"
description = "Ling-bot —— 独立的 QQ 机器人桌面端"
authors = ["ling-bot"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ling_bot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
